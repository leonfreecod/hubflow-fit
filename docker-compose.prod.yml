services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-hubflow}
      POSTGRES_USER: ${DATABASE_USERNAME:?Defina DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD}
    volumes:
      - hubflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-hubflow}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Defina DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-30}
      CORS_ALLOWED_ORIGIN: ${APP_ORIGIN:?Defina APP_ORIGIN}
      APP_FRONTEND_URL: ${APP_ORIGIN:?Defina APP_ORIGIN}
      PIX_WEBHOOK_SECRET: ${PIX_WEBHOOK_SECRET:?Defina PIX_WEBHOOK_SECRET}
      PORTFOLIO_DEMO_ENABLED: ${PORTFOLIO_DEMO_ENABLED:-false}
      PORTFOLIO_DEMO_EMAIL: ${PORTFOLIO_DEMO_EMAIL:-demo@hubflow.fit}
      PORTFOLIO_DEMO_PASSWORD: '${PORTFOLIO_DEMO_PASSWORD:-}'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --spider http://localhost:8080/actuator/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        VITE_API_URL: /api
        VITE_DATA_SOURCE: api
        VITE_DEMO_MODE: '${PORTFOLIO_DEMO_ENABLED:-false}'
        VITE_DEMO_EMAIL: '${PORTFOLIO_DEMO_EMAIL:-demo@hubflow.fit}'
        VITE_DEMO_ACCESS_CODE: '${PORTFOLIO_DEMO_PASSWORD:-}'
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --spider http://127.0.0.1:8080/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  hubflow_postgres_data:
