name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: coverage
          if-no-files-found: ignore

  backend:
    name: Backend and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -f backend/pom.xml verify
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  e2e:
    name: Full-stack browser smoke
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_PASSWORD: ci-database-password
      JWT_SECRET: ci-jwt-secret-with-more-than-thirty-two-bytes
      PIX_WEBHOOK_SECRET: ci-pix-webhook-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start full stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Run browser smoke test
        run: npm run e2e
      - name: Capture service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Stop full stack
        if: always()
        run: docker compose down --volumes
