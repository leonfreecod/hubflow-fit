spring:
  datasource:
    url: jdbc:h2:mem:hubflow-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

app:
  jwt:
    secret: hubflow-test-secret-key-with-at-least-thirty-two-bytes
